<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Edsger responsive review</title><style>body{font:16px system-ui;margin:24px;background:#e7eaf0}label{display:block;margin-bottom:16px}select{font:inherit;padding:8px}article{margin-bottom:28px;width:max-content}h2{font-size:16px}iframe{display:block;border:1px solid #aeb8c6;background:white;height:850px}</style></head><body><h1>Responsive layout review</h1><label>Section <select id="section"><option value="">Hero</option><option value="features">Features</option><option value="models">Models</option><option value="pricing">Pricing</option><option value="faq">FAQ</option></select></label><main id="views"></main><script>
const widths=[320,360,375,390,430,650,651,768,850,851,1024,1050,1051,1280,1440,1920];
const main=document.getElementById('views');
for(const width of widths){const article=document.createElement('article');article.innerHTML=`<h2>${width}px</h2><iframe title="${width}px preview" width="${width}" data-width="${width}" src="../index.html?review=branding-9"></iframe>`;main.append(article)}
document.getElementById('section').addEventListener('change',event=>{for(const frame of document.querySelectorAll('iframe'))frame.src='../index.html?review=branding-9#'+event.target.value});
</script></body></html>
